<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reseller A Yudi</title>
<style>
body{margin:0;font-family:Arial;background:#f5f5f5;color:#222}header{background:#111;color:white;padding:18px;text-align:center}
main{max-width:850px;margin:auto;padding:15px}.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{border:1px solid #ddd;border-radius:10px;padding:14px}
button{background:#111;color:#fff;border:0;border-radius:8px;padding:11px 14px;font-weight:bold}
input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
.price{font-size:20px;font-weight:bold;margin:8px 0}.muted{color:#777;font-size:13px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
</style>
</head>
<body>
<header><h2>RESELLER A YUDI</h2><div>Produk Digital • Order Mudah</div></header>
<main>
<section class="card"><h3>Produk</h3><div id="products" class="grid"></div></section>
<section class="card"><h3>Keranjang</h3><div id="cart">Belum ada produk.</div><h3 id="total">Rp0</h3></section>
<section class="card">
<h3>Data Pembeli</h3>
<input id="nama" placeholder="Nama pembeli">
<input id="wa" placeholder="Nomor WhatsApp">
<input id="catatan" placeholder="Catatan (opsional)">
<button onclick="buatOrder()">Buat Order</button>
<div id="hasil"></div>
</section>
</main>
<script>
const produk=[
{id:"p1",nama:"Paket 1 Bulan",durasi:"1 Bulan",harga:25000},
{id:"p2",nama:"Paket 3 Bulan",durasi:"3 Bulan",harga:60000},
{id:"p3",nama:"Paket 6 Bulan",durasi:"6 Bulan",harga:110000},
{id:"p4",nama:"Paket 12 Bulan",durasi:"12 Bulan",harga:200000}
];
let cart=[];
const rp=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
function render(){
 document.getElementById("products").innerHTML=produk.map(p=>`<div class="item"><b>${p.nama}</b><div class="muted">${p.durasi}</div><div class="price">${rp(p.harga)}</div><button onclick="add('${p.id}')">Tambah</button></div>`).join("");
 document.getElementById("cart").innerHTML=cart.length?cart.map(x=>`<div class="row"><span>${x.nama} × ${x.qty}</span><button onclick="removeItem('${x.id}')">−</button></div>`).join(""):"Belum ada produk.";
 document.getElementById("total").textContent=rp(cart.reduce((s,x)=>s+x.harga*x.qty,0));
}
function add(id){let p=produk.find(x=>x.id===id),x=cart.find(x=>x.id===id);x?x.qty++:cart.push({...p,qty:1});render()}
function removeItem(id){let x=cart.find(x=>x.id===id);if(x.qty>1)x.qty--;else cart=cart.filter(y=>y.id!==id);render()}
function buatOrder(){
 if(!cart.length)return alert("Pilih produk terlebih dahulu.");
 let nama=document.getElementById("nama").value.trim(),wa=document.getElementById("wa").value.trim();
 if(!nama||!wa)return alert("Nama dan WhatsApp wajib diisi.");
 let total=cart.reduce((s,x)=>s+x.harga*x.qty,0);
 let no="RY-"+Date.now();
 let order={no,nama,wa,catatan:document.getElementById("catatan").value.trim(),items:cart,total,status:"MENUNGGU PEMBAYARAN",createdAt:new Date().toISOString()};
 localStorage.setItem("reseller_order_"+no,JSON.stringify(order));
 document.getElementById("hasil").innerHTML=`<p><b>Order ${no} berhasil dibuat.</b></p><p>Total: <b>${rp(total)}</b></p><p>Status: MENUNGGU PEMBAYARAN</p><button onclick="kirim('${no}')">Kirim Order WhatsApp</button>`;
}
function kirim(no){
 let o=JSON.parse(localStorage.getItem("reseller_order_"+no));
 let teks=`Order ${o.no}%0ANama: ${o.nama}%0A${o.items.map(x=>x.nama+" x"+x.qty).join("%0A")}%0ATotal: ${rp(o.total)}%0AStatus: ${o.status}`;
 let nomor="628XXXXXXXXXX";
 window.open("https://wa.me/"+nomor+"?text="+teks,"_blank");
}
render();
</script>
</body></html>
